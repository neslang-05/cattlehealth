<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattle Health Monitoring System</title>
  <meta name="description" content="Real-time multi-device cattle health monitoring dashboard — pulse, temperature, distance.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="header-title">
        <span class="sub-label">Cattle Health Monitor</span>
        <h1>Sensor Data Overview</h1>
      </div>
      <div class="live-badge">
        <span class="badge-dot"></span>
        Live
      </div>
    </div>
  </header>

  <!-- District Filter Bar -->
  <div class="district-filter-bar">
    <div class="filter-container">
      <span class="filter-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        District
      </span>
      <div class="district-pills" id="district-pills" role="radiogroup" aria-label="Filter by district">
        <!-- Injected dynamically by script.js -->
      </div>
    </div>
  </div>

  <!-- Device Tab Navigation (populated by script.js) -->
  <nav class="device-tabs" id="device-tabs" role="tablist" aria-label="Device selection">
    <!-- Tab buttons injected here -->
  </nav>

  <!-- Tab Panels (populated by script.js) -->
  <div class="panels-container" id="panels-container">
    <!-- .device-panel elements injected here -->
  </div>

  <footer>
    <div class="footer-bar">
      <div class="footer-left">
        <span class="pulsing-dot"></span>
        Last updated: <span id="timestamp-val" class="mono">—</span>
      </div>
      <div class="footer-right">
        <span id="footer-device-label" class="mono">—</span> · <span id="footer-district-label" class="mono">—</span> · <span id="footer-source-label">Firebase RTDB</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
